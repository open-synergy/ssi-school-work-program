scenarios:
  - name: "CRUD Type"
    steps:
      - step: "Create Type"
        action: "create"
        model: "work_program_type"
        save_as: "record"
        values:
          code: "/"
          name: "Tour Type Test"
      - step: "Assert created"
        action: "assert"
        target: "record"
        asserts:
          id:
            type: "value"
            operator: "is_truthy"
          name:
            type: "value"
            expected: "Tour Type Test"
          active:
            type: "value"
            expected: true
      - step: "Edit Type"
        action: "write"
        target: "record"
        values:
          name: "Tour Type Test Edited"
      - step: "Assert edited"
        action: "assert"
        target: "record"
        asserts:
          name:
            type: "value"
            expected: "Tour Type Test Edited"
      - step: "Delete Type"
        action: "unlink"
        target: "record"
      - step: "Verify deleted"
        action: "search"
        model: "work_program_type"
        domain: [["name", "=", "Tour Type Test Edited"]]
        save_as: "result"
        expect_count: 0

