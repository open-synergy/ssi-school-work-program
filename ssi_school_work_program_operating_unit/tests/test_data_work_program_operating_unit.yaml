      - step: "Move the draft program to Operating Unit B"
        action: "write"
        target: "wpou2_program"
        values:
          operating_unit_id: "REC: wpou2_ou_b.id"

      - step: "The existing occurrences now carry Operating Unit B"
        action: "search"
        model: "work_program_occurrence"
        domain:
          - ["work_program_id", "=", "REC: wpou2_program.id"]
          - ["operating_unit_id", "=", "REC: wpou2_ou_b.id"]
        save_as: "wpou2_in_b"
        expect_count: 4

