options:
  auto_refresh: true

scenarios:
  - name: "Program keeps the chosen Operating Unit and generated occurrences follow it"
    steps:
      - step: "Get main company"
        action: "ref"
        xml_id: "base.main_company"
        save_as: "wpou1_company"

      - step: "Setup - create grade type"
        action: "create"
        model: "school_grade_type"
        save_as: "wpou1_grade_type"
        values:
          code: "/"
          name: "Grade Type WPOU1"

      - step: "Setup - create school"
        action: "create"
        model: "school"
        save_as: "wpou1_school"
        values:
          code: "/"
          name: "School WPOU1"
          grade_type_id: "REC: wpou1_grade_type.id"

      - step: "Setup - create academic year"
        action: "create"
        model: "school_academic_year"
        save_as: "wpou1_year"
        values:
          code: "/"
          name: "Year WPOU1"
          date_start: "2026-01-01"
          date_end: "2026-12-31"

      - step: "Setup - create employee"
        action: "create"
        model: "hr.employee"
        save_as: "wpou1_employee"
        values:
          name: "Employee WPOU1"

      - step: "Setup - create work program type"
        action: "create"
        model: "work_program_type"
        save_as: "wpou1_wp_type"
        values:
          code: "/"
          name: "Type WPOU1"

      - step: "Setup - create work program category"
        action: "create"
        model: "work_program_category"
        save_as: "wpou1_wp_category"
        values:
          code: "/"
          name: "Category WPOU1"

      - step: "Setup - create partner of Operating Unit A"
        action: "create"
        model: "res.partner"
        save_as: "wpou1_ou_a_partner"
        values:
          name: "WPOU1 Operating Unit A Partner"

      - step: "Setup - create Operating Unit A"
        action: "create"
        model: "operating.unit"
        save_as: "wpou1_ou_a"
        values:
          name: "WPOU1 Operating Unit A"
          code: "WPOU1A"
          company_id: "REC: wpou1_company.id"
          partner_id: "REC: wpou1_ou_a_partner.id"

      - step: "Setup - create partner of Operating Unit B"
        action: "create"
        model: "res.partner"
        save_as: "wpou1_ou_b_partner"
        values:
          name: "WPOU1 Operating Unit B Partner"

      - step: "Setup - create Operating Unit B"
        action: "create"
        model: "operating.unit"
        save_as: "wpou1_ou_b"
        values:
          name: "WPOU1 Operating Unit B"
          code: "WPOU1B"
          company_id: "REC: wpou1_company.id"
          partner_id: "REC: wpou1_ou_b_partner.id"

      - step: "Setup - create the Monday frequency"
        action: "create"
        model: "frequency"
        save_as: "wpou1_monday"
        values:
          code: "/"
          name: "Every Monday WPOU1"
          interval: 1
          interval_type: "weekly"
          use_byweekday: true
          mo: true

      - step: "Setup - create the frequency set"
        action: "create"
        model: "frequency_set"
        save_as: "wpou1_frequency_set"
        values:
          code: "/"
          name: "Mondays WPOU1"
          fsm_frequency_ids:
            - - 6
              - 0
              - - "REC: wpou1_monday.id"

      - step: "Create work program WPOU1 Generate"
        action: "create"
        model: "work_program"
        save_as: "wpou1_program"
        values:
          title: "WPOU1 Generate"
          school_id: "REC: wpou1_school.id"
          academic_year_id: "REC: wpou1_year.id"
          type_id: "REC: wpou1_wp_type.id"
          category_id: "REC: wpou1_wp_category.id"
          pic_id: "REC: wpou1_employee.id"
          date_start: "2026-01-01"
          date_end: "2026-01-28"
          operating_unit_id: "REC: wpou1_ou_b.id"
          frequency_set_id: "REC: wpou1_frequency_set.id"

      - step: "The program has Operating Unit B, not the default one"
        action: "assert"
        target: "wpou1_program"
        asserts:
          operating_unit_id:
            type: "m2o"
            expected: "REC: wpou1_ou_b"

      - step: "Generate the occurrence"
        action: "call"
        target: "wpou1_program"
        method: "action_generate_occurrence"

      - step: "Every generated occurrence carries Operating Unit B"
        action: "search"
        model: "work_program_occurrence"
        domain:
          - ["work_program_id", "=", "REC: wpou1_program.id"]
          - ["operating_unit_id", "=", "REC: wpou1_ou_b.id"]
        save_as: "wpou1_in_b"
        expect_count: 4

      - step: "No occurrence of the program carries another Operating Unit"
        action: "search"
        model: "work_program_occurrence"
        domain:
          - ["work_program_id", "=", "REC: wpou1_program.id"]
          - ["operating_unit_id", "!=", "REC: wpou1_ou_b.id"]
        save_as: "wpou1_not_b"
        expect_count: 0

