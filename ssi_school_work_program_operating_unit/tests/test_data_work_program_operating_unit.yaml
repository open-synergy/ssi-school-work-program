  - name:
      "Operating Unit rules hide programs, occurrences and evaluations of other units"
    steps:
      - step: "Get main company"
        action: "ref"
        xml_id: "base.main_company"
        save_as: "wpou4_company"

      - step: "Setup - create grade type"
        action: "create"
        model: "school_grade_type"
        save_as: "wpou4_grade_type"
        values:
          code: "/"
          name: "Grade Type WPOU4"

      - step: "Setup - create school"
        action: "create"
        model: "school"
        save_as: "wpou4_school"
        values:
          code: "/"
          name: "School WPOU4"
          grade_type_id: "REC: wpou4_grade_type.id"

      - step: "Setup - create academic year"
        action: "create"
        model: "school_academic_year"
        save_as: "wpou4_year"
        values:
          code: "/"
          name: "Year WPOU4"
          date_start: "2026-01-01"
          date_end: "2026-12-31"

      - step: "Setup - create employee"
        action: "create"
        model: "hr.employee"
        save_as: "wpou4_employee"
        values:
          name: "Employee WPOU4"

      - step: "Setup - create work program type"
        action: "create"
        model: "work_program_type"
        save_as: "wpou4_wp_type"
        values:
          code: "/"
          name: "Type WPOU4"

      - step: "Setup - create work program category"
        action: "create"
        model: "work_program_category"
        save_as: "wpou4_wp_category"
        values:
          code: "/"
          name: "Category WPOU4"

      - step: "Setup - create partner of Operating Unit A"
        action: "create"
        model: "res.partner"
        save_as: "wpou4_ou_a_partner"
        values:
          name: "WPOU4 Operating Unit A Partner"

      - step: "Setup - create Operating Unit A"
        action: "create"
        model: "operating.unit"
        save_as: "wpou4_ou_a"
        values:
          name: "WPOU4 Operating Unit A"
          code: "WPOU4A"
          company_id: "REC: wpou4_company.id"
          partner_id: "REC: wpou4_ou_a_partner.id"

      - step: "Setup - create partner of Operating Unit B"
        action: "create"
        model: "res.partner"
        save_as: "wpou4_ou_b_partner"
        values:
          name: "WPOU4 Operating Unit B Partner"

      - step: "Setup - create Operating Unit B"
        action: "create"
        model: "operating.unit"
        save_as: "wpou4_ou_b"
        values:
          name: "WPOU4 Operating Unit B"
          code: "WPOU4B"
          company_id: "REC: wpou4_company.id"
          partner_id: "REC: wpou4_ou_b_partner.id"

      - step: "Create work program WPOU4 Program A"
        action: "create"
        model: "work_program"
        save_as: "wpou4_program_a"
        values:
          title: "WPOU4 Program A"
          school_id: "REC: wpou4_school.id"
          academic_year_id: "REC: wpou4_year.id"
          type_id: "REC: wpou4_wp_type.id"
          category_id: "REC: wpou4_wp_category.id"
          pic_id: "REC: wpou4_employee.id"
          date_start: "2026-01-01"
          date_end: "2026-01-28"
          operating_unit_id: "REC: wpou4_ou_a.id"

      - step: "Create work program WPOU4 Program B"
        action: "create"
        model: "work_program"
        save_as: "wpou4_program_b"
        values:
          title: "WPOU4 Program B"
          school_id: "REC: wpou4_school.id"
          academic_year_id: "REC: wpou4_year.id"
          type_id: "REC: wpou4_wp_type.id"
          category_id: "REC: wpou4_wp_category.id"
          pic_id: "REC: wpou4_employee.id"
          date_start: "2026-01-01"
          date_end: "2026-01-28"
          operating_unit_id: "REC: wpou4_ou_b.id"

      - step: "Create an occurrence of program A"
        action: "create"
        model: "work_program_occurrence"
        save_as: "wpou4_occurrence_a"
        values:
          work_program_id: "REC: wpou4_program_a.id"
          name: "WPOU4 Occurrence A"
          date_start: "2026-01-12"

      - step: "Create an evaluation of program A"
        action: "create"
        model: "work_program_evaluation"
        save_as: "wpou4_evaluation_a"
        values:
          work_program_id: "REC: wpou4_program_a.id"
          evaluation_type: "final"
          date: "2026-02-01"

      - step: "Create an occurrence of program B"
        action: "create"
        model: "work_program_occurrence"
        save_as: "wpou4_occurrence_b"
        values:
          work_program_id: "REC: wpou4_program_b.id"
          name: "WPOU4 Occurrence B"
          date_start: "2026-01-12"

      - step: "Create an evaluation of program B"
        action: "create"
        model: "work_program_evaluation"
        save_as: "wpou4_evaluation_b"
        values:
          work_program_id: "REC: wpou4_program_b.id"
          evaluation_type: "final"
          date: "2026-02-01"

      # The restricted user is deliberately NOT put in ``base.group_user``:
      # the internal user rule of the base module is scoped to that group
      # and would OR its own domain back in, masking the Operating Unit
      # rules. Leaving it out makes the Operating Unit rules the only active
      # group rules, so the assertions below are caused by them alone.
      - step: "Create a user restricted to Operating Unit A only"
        action: "create"
        model: "res.users"
        save_as: "wpou4_restricted_user"
        values:
          name: "WPOU4 Restricted User"
          login: "wpou4_restricted_user@example.com"
          groups_id:
            - - 6
              - 0
              - - "REF: ssi_school_work_program.work_program_user_group"
                - "REF: ssi_school_work_program.work_program_evaluation_user_group"
                - "REF:
                  ssi_school_work_program_operating_unit.work_program_operating_unit_group"
                - "REF:
                  ssi_school_work_program_operating_unit.work_program_evaluation_operating_unit_group"
          assigned_operating_unit_ids: [[6, 0, ["REC: wpou4_ou_a.id"]]]

      - step: "Restricted user searches the program of Operating Unit B -- excluded"
        action: "search"
        model: "work_program"
        domain:
          - ["id", "=", "REC: wpou4_program_b.id"]
        save_as: "wpou4_search_program_b"
        as_user: "wpou4_restricted_user"
        expect_count: 0

      - step: "Restricted user searches the program of Operating Unit A -- visible"
        action: "search"
        model: "work_program"
        domain:
          - ["id", "=", "REC: wpou4_program_a.id"]
        save_as: "wpou4_search_program_a"
        as_user: "wpou4_restricted_user"
        expect_count: 1

      - step: "Restricted user searches the occurrence of Operating Unit B -- excluded"
        action: "search"
        model: "work_program_occurrence"
        domain:
          - ["id", "=", "REC: wpou4_occurrence_b.id"]
        save_as: "wpou4_search_occurrence_b"
        as_user: "wpou4_restricted_user"
        expect_count: 0

      - step: "Restricted user searches the occurrence of Operating Unit A -- visible"
        action: "search"
        model: "work_program_occurrence"
        domain:
          - ["id", "=", "REC: wpou4_occurrence_a.id"]
        save_as: "wpou4_search_occurrence_a"
        as_user: "wpou4_restricted_user"
        expect_count: 1

      - step: "Restricted user searches the evaluation of Operating Unit B -- excluded"
        action: "search"
        model: "work_program_evaluation"
        domain:
          - ["id", "=", "REC: wpou4_evaluation_b.id"]
        save_as: "wpou4_search_evaluation_b"
        as_user: "wpou4_restricted_user"
        expect_count: 0

      - step: "Restricted user searches the evaluation of Operating Unit A -- visible"
        action: "search"
        model: "work_program_evaluation"
        domain:
          - ["id", "=", "REC: wpou4_evaluation_a.id"]
        save_as: "wpou4_search_evaluation_a"
        as_user: "wpou4_restricted_user"
        expect_count: 1
